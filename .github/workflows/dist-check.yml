name: Check dist

on:
  pull_request:

permissions:
  contents: write

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Check for changes in dist
        id: diff
        run: |
          if git diff --quiet dist/index.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit updated dist
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git commit -m "chore: update dist/index.js"
          git push
      - name: Fail if dist is outdated (fork PR)
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::dist/index.js is out of date. Run 'npm run build' locally and commit the result."
          exit 1
